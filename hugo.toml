baseURL = "https://b1nary0utput.github.io/"
languageCode = "en-us"
title = "b1nary0utput"
theme = "PaperMod"

[params]
  env = "production"
  description = "Infosec notes, CTF writeups, and training logs"
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  disableSpecial1stPost = true
  defaultTheme = "dark"
  disableThemeToggle = false

[markup.goldmark.renderer]
  unsafe = true

